# golden-path-demo-secrets — Kubernetes Secret materialised by External Secrets Operator.
#
# This file REPLACES the previous ``secrets.yaml`` which committed
# base64-encoded plaintext credentials directly to git. That pattern is
# explicitly called out as an anti-pattern in ADR-0018 — base64 is
# encoding, not encryption, and committing data: blobs to git is a
# distribution-grade leak.
#
# In its place, this ExternalSecret tells the External Secrets Operator
# to materialise a Kubernetes ``Secret`` named ``golden-path-demo-secrets``
# (the same name the demo Deployment consumes) by pulling four keys from
# the configured ClusterSecretStore. For the local idpbuilder demo the
# store is typically a SealedSecrets-backed Vault or a local-dev
# placeholder; for production deployments wire it to AWS Secrets Manager,
# Vault, or GCP Secret Manager.
#
# To swap to SealedSecrets instead, delete this file and create a
# ``SealedSecret`` produced by ``kubeseal``. The downstream Deployment
# does not change either way.
#
# See:
#   - ADR-0018 (docs/adr/0018-credential-management-approach.md)
#   - cnoe-stacks/nodejs-gitops-template/externalsecret.yaml (the template)
#
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: golden-path-demo-secrets
  namespace: golden-path-demo
  labels:
    app: golden-path-demo
    environment: dev
    managed-by: argocd
    app.kubernetes.io/name: golden-path-demo
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: golden-path-demo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster-secret-store
  target:
    name: golden-path-demo-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: database-url
      remoteRef:
        key: golden-path-demo/database
        property: url
    - secretKey: redis-url
      remoteRef:
        key: golden-path-demo/redis
        property: url
    - secretKey: jwt-secret
      remoteRef:
        key: golden-path-demo/jwt
        property: secret
    - secretKey: api-key
      remoteRef:
        key: golden-path-demo/api
        property: key
