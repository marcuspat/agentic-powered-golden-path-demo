# ExternalSecret -- references a secret kept in an external store (Vault, AWS
# Secrets Manager, GCP Secret Manager, etc.) via the External Secrets Operator
# (https://external-secrets.io/).
#
# For local idpbuilder demos, you may prefer Sealed Secrets instead. To swap:
#   1. Install the bitnami-labs/sealed-secrets controller in the cluster.
#   2. Replace this file with the output of:
#        kubectl create secret generic {{ appName }}-config \
#          --from-literal=EXAMPLE_KEY=value --dry-run=client -o yaml \
#          | kubeseal --format=yaml \
#          > sealedsecret.yaml
#   3. Add `sealedsecret.yaml` to kustomization.yaml in place of this file.
# See ADR-0018 for the full rationale.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ appName }}-config
  namespace: {{ namespace | default(appName) }}
  labels:
    app.kubernetes.io/name: {{ appName }}
    app.kubernetes.io/managed-by: golden-path-agent
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster-secret-store
  target:
    name: {{ appName }}-config
    creationPolicy: Owner
  data:
    # TODO: replace with real keys; this is a placeholder example only.
    - secretKey: EXAMPLE_KEY
      remoteRef:
        key: {{ appName }}/example
        property: value
