apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ appName }}
  namespace: {{ namespace | default(appName) }}
  labels:
    app.kubernetes.io/name: {{ appName }}
    app.kubernetes.io/managed-by: golden-path-agent
    app.kubernetes.io/version: "0.1.0"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - {{ host | default(appName + ".cnoe.localtest.me") }}
      secretName: cnoe-wildcard-tls
  rules:
    - host: {{ host | default(appName + ".cnoe.localtest.me") }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ appName }}
                port:
                  number: 80
