apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: {{ namespace | default(appName) }}
commonLabels:
  app.kubernetes.io/name: "{{ appName }}"
  app.kubernetes.io/managed-by: golden-path-agent
resources:
  - namespace.yaml
  - resourcequota.yaml
  - networkpolicy.yaml
  - configmap.yaml
  - externalsecret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - servicemonitor.yaml
