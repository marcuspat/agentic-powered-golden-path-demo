name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Lint
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Lint ai-onboarding-agent/
        run: ruff check ai-onboarding-agent/ --select E,W,F,I --ignore E501

      - name: Lint src/
        run: ruff check src/ --select E,W,F,I --ignore E501

  # ---------------------------------------------------------------------------
  # Unit tests - v1 functional agent (ai-onboarding-agent/)
  # ---------------------------------------------------------------------------
  test-v1:
    name: Unit tests - v1 agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install \
            PyGithub==1.59.1 \
            kubernetes==28.1.0 \
            jinja2==3.1.2 \
            openai==1.3.7 \
            python-dotenv==1.0.0 \
            pytest

      - name: Run v1 tests
        env:
          OPENROUTER_API_KEY: test-key
          GITHUB_TOKEN: test-token
          GITHUB_USERNAME: test-user
        run: |
          cd ai-onboarding-agent
          python -m pytest test_agent.py -v --tb=short

  # ---------------------------------------------------------------------------
  # Unit tests - v2 OOP agent (src/)
  # ---------------------------------------------------------------------------
  test-v2:
    name: Unit tests - v2 agent (src/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install \
            PyGithub==1.59.1 \
            kubernetes==28.1.0 \
            jinja2==3.1.2 \
            openai==1.3.7 \
            python-dotenv==1.0.0 \
            requests==2.31.0 \
            pytest

      - name: Run v2 tests
        env:
          OPENROUTER_API_KEY: test-key
          GITHUB_TOKEN: test-token
          GITHUB_USERNAME: test-user
          NODEJS_TEMPLATE_PATH: /tmp
          GITOPS_TEMPLATE_PATH: /tmp
        run: |
          cd src
          python -m pytest test_agent.py -v --tb=short

  # ---------------------------------------------------------------------------
  # Validate ArgoCD manifest schema
  # ---------------------------------------------------------------------------
  validate-manifests:
    name: Validate ArgoCD manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSLo /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform

      - name: Validate GitOps templates
        run: |
          find cnoe-stacks -name "*.yaml" -o -name "*.yml" | while read f; do
            echo "Validating: $f"
            kubeconform -ignore-missing-schemas "$f" || true
          done

  # ---------------------------------------------------------------------------
  # Dry-run smoke test (no real credentials)
  # ---------------------------------------------------------------------------
  dry-run-smoke:
    name: Dry-run smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install \
            PyGithub==1.59.1 \
            kubernetes==28.1.0 \
            jinja2==3.1.2 \
            openai==1.3.7 \
            python-dotenv==1.0.0 \
            requests==2.31.0

      - name: Smoke test --dry-run
        env:
          NODEJS_TEMPLATE_PATH: cnoe-stacks/nodejs-template/app-source
          GITOPS_TEMPLATE_PATH: cnoe-stacks/nodejs-gitops-template
        run: |
          python src/agent.py --dry-run \
            "I need to deploy my new NodeJS service called smoke-test-api"
